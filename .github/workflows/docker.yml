name: Build and Push Docker Image

# Build bot Docker image and push to GitHub Container Registry
on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ordodotsh/ordo-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Convex BOT_IMAGE via HTTP
        continue-on-error: true
        run: |
          if [ -n "$CONVEX_URL" ] && [ -n "$WEBHOOK_SECRET" ]; then
            # Use SHA tag (guaranteed unique, forces fresh pull)
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            
            curl -X POST "${CONVEX_URL}/api/update-bot-image" \
              -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"image\": \"${IMAGE}\"}"
            
            echo "Updated BOT_IMAGE to: ${IMAGE}"
          else
            echo "Skipping: CONVEX_URL or WEBHOOK_SECRET not configured"
          fi
        env:
          CONVEX_URL: ${{ secrets.CONVEX_HTTP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
